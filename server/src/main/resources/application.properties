server.port=${APP_PORT:9090}

# 数据库配置
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/media_db?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 文件上传
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# MyBatis Plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI 模型配置 (通过环境变量注入)
# ==============================
ai.deepseek.api-key=${DEEPSEEK_API_KEY:your-api-key-here}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.siliconflow.cn/v1}
ai.aliyun.api-key=${ALIYUN_API_KEY:your-api-key-here}

# ==============================
# Redis 配置
# ==============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ==============================
# MinIO 配置
# ==============================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET:media}

# ==============================
# 工具路径
# ==============================
tool.ytdlp.path=${YTDLP_PATH:D:/yt-dlp/yt-dlp.exe}
tool.ffmpeg.dir=${FFMPEG_DIR:D:/ffmpeg/bin}

# ==============================
# JWT 配置
# ==============================
jwt.secret=${JWT_SECRET:DoVedioPlusSecretKeyChangeMeInProduction}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================
# RocketMQ 配置
# ==============================
rocketmq.name-server=${ROCKETMQ_HOST:127.0.0.1:9876}
rocketmq.producer.group=video-analysis-group
rocketmq.producer.send-message-timeout=3000
